[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unetpp-hairline"
version = "0.1.0"
description = "UNet++ segmentation of thin and faint concrete cracks on a ConvNeXt or EfficientNet encoder"
requires-python = ">=3.11"
dependencies = ["torch>=2.9", "torchvision>=0.24", "numpy", "opencv-python-headless", "pillow", "matplotlib",
                "segmentation-models-pytorch==0.5.0", "timm>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
